name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm run verify:pack
